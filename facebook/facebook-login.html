<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook</title>
    <link rel="stylesheet" href="facebook-login.css">
</head>
<body>
    <main class="facebook-page">

        <section class="left-side">
            <div class="left content">
                <img class="facebook-image" src="photos/Screenshot 2026-08-19 104600.png" alt="Facebook illustration">
            </div>
        </section>

        <section class="right-side">
            <div class="login-box">
                <h2>log in to facebook</h2>

                <form id="facebook-login-form">
                    <input id="facebook-email" type="email" placeholder="Enter your Email" required>
                    <input type="password" placeholder="Enter your password" required>
                    <button type="submit">Log in</button>
                </form>

                <a href="#" class="forgot">I forgot my password</a>
                <hr>
                <a href="facebook-signin.html" class="create">Create your new Account</a>
            </div>

        </section>


    </main>
    <script src="facebook-login.js"></script>
</body>
</html>
