<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Facebook</title>
    <link rel="stylesheet" href="facebook-signin.css">
</head>
<body>
    <main class="facebook-page">
        <section class="left-side">
            <div class="left content">
                <img class="facebook-image" src="../photos/Screenshot 2026-08-19 104600.png" alt="Facebook illustration">
            </div>
        </section>

        <section class="right-side">
            <div class="login-box">
                <h2>Sign in to Facebook</h2>

                <form id="facebook-signin-form">
                    <input type="text" id="facebook-name" placeholder="Enter your name" required>
                    <input type="email" id="facebook-signin-email" placeholder="Enter your email" required>
                    <input type="password" placeholder="Create a password" required>
                    <button type="submit">Sign in</button>
                </form>

                <hr>
                <a href="facebook-login.html" class="create">Already have an account? Log in</a>
            </div>
        </section>
    </main>

    <script src="facebook-signin.js"></script>
</body>
</html>
