<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANKAGEO WEB</title>
</head>

<body>
    <header>
       
    </header>
    <main>

    <section>
        <h2>Add Personnel</h2>

        <form>
            <div>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter name"
                    required
                >
            </div>

            <div>
                <label for="surname">Surname:</label>
                <input
                    type="text"
                    id="surname"
                    name="surname"
                    placeholder="Enter surname"
                    required
                >
            </div>

            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >
            </div>

            <div>
                <label for="phone">Phone:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                >
            </div>

            <div>
                <label for="department">Department:</label>

                <select id="department" name="department">
                    <option value="">Select Department</option>
                    <option value="software">Software</option>
                    <option value="gis">GIS</option>
                    <option value="ai">AI</option>
                </select>
            </div>

            <button type="submit">Add Person</button>
        </form>
    </section>


    <section>
        <h2>Personnel List</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Surname</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>John</td>
                    <td>Doe</td>
                    <td>john@example.com</td>
                    <td>5551234567</td>
                    <td>Software</td>
                </tr>

                <tr>
                    <td>Jane</td>
                    <td>Smith</td>
                    <td>jane@example.com</td>
                    <td>5559876543</td>
                    <td>GIS</td>
                </tr>
                <tr>
                    <td>ali</td>
                    <td>saad</td>
                    <td>ali.@example.com</td>
                    <td>0532234563</td>
                    <td>it</td>
                </tr>
            </tbody>
        </table>
    </section>

</main>
    <footer>

    </footer>
</body>

</html>
